services:
  cockroach:
    image: cockroachdb/cockroach:v26.2.3
    command: start-single-node --insecure --store=type=mem,size=1GiB
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      CC_ENVIRONMENT: local
      CC_DATABASE_URL: postgresql+psycopg://root@cockroach:26257/defaultdb?sslmode=disable
      CC_DATABASE_REQUIRED: "true"
    ports:
      - "8000:8000"
    depends_on:
      cockroach:
        condition: service_healthy
