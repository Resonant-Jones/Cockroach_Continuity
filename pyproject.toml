[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cockroach-continuity"
version = "0.1.0"
description = "A provenance-backed continuity ledger for resilient agentic systems."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2.9,<4",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cockroach_continuity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cockroach_continuity"]
